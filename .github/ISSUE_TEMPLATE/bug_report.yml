name: Bug report
description: Something in Nebula Co-Op is broken, crashes, or plays differently for different players.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A few things first:

        - **Security problems** (anything that lets another player or a room run code, read or write files, crash
          someone else's game, or get past a password or a ban) must **not** go here. Report them privately as
          [SECURITY.md](https://github.com/NebulaCoop/nebula-coop/blob/main/SECURITY.md) says.
        - **Does it happen in plain [Nebula](https://github.com/keepvaibin/nebula) too?** If it has nothing to do with
          co-op (graphics, controls, Setup, the launcher, a game bug), it may be upstream's, and
          [keepvaibin/nebula](https://github.com/keepvaibin/nebula/issues) is the place for it. Please don't report
          co-op problems there.
        - Room codes are fine to share once the room is closed. **Never paste a room password.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected to happen instead.
      placeholder: When the second player joins Good Egg Galaxy, the host's game freezes for a few seconds...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, as exact as you can. Say which galaxy and star, and which player does what.
      placeholder: |
        1. Host a room on NebulaNet with 3 players
        2. Everyone enters Good Egg Galaxy, star 1
        3. The joiner playing Luigi spins near the host
        4. ...
    validations:
      required: true
  - type: dropdown
    id: how-often
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Once or rarely
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nebula Co-Op version
      description: Shown in Windows under Settings > Apps > Installed apps (NebulaCoop), or the release you installed. Say if it's a CI test build or one you built yourself, with its commit.
      placeholder: v1.0.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Android
        - Other (say below)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: NVIDIA RTX 3060, driver 610.88
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - Direct3D 12
        - Vulkan
        - Metal
        - I don't know
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Game disc
      options:
        - North America (RMGE01)
        - Europe (RMGP01)
        - Japan (RMGJ01)
    validations:
      required: true
  - type: dropdown
    id: room
    attributes:
      label: Were you in a co-op room?
      options:
        - "No, playing alone (not in a room)"
        - "Yes, I was the host"
        - "Yes, I had joined someone's room"
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Players in the room
      description: How many, and who played which character. Leave empty if you weren't in a room.
      placeholder: 3 players (host Mario, two Luigis)
  - type: dropdown
    id: connection
    attributes:
      label: How the room was joined
      options:
        - NebulaNet (room code or ROOMS list)
        - Direct (address:port)
        - Direct over a VPN (Tailscale, ZeroTier, Radmin VPN...)
        - Not in a room
  - type: dropdown
    id: upstream
    attributes:
      label: Does it happen in plain Nebula?
      description: Only if you have [Nebula](https://github.com/keepvaibin/nebula) installed. If it does, it may belong upstream (see the top of this form).
      options:
        - "No, only in Nebula Co-Op"
        - "Yes, plain Nebula does it too"
        - "I didn't try / it needs co-op"
  - type: textarea
    id: mods
    attributes:
      label: Mods and texture packs
      description: The room's mods (the host picks them), plus any texture packs. Write "none" if there were none.
      placeholder: Personal Star Counter, Character Movesets
  - type: textarea
    id: logs
    attributes:
      label: Crash report and log
      description: |
        If the game closed or showed a `NEB-` code, drag in the crash report from `%LOCALAPPDATA%\NebulaCoop\crashes`:
        the newest `.txt`, and its `.dmp` zipped (GitHub won't take a `.dmp` by itself).

        For other problems, attach `%LOCALAPPDATA%\NebulaCoop\logs\latest.log` **before starting the game again**
        (the next start replaces it; the one before is `previous.log`). For a co-op problem, the host's and the
        joiner's logs together help most.
      placeholder: Drag files here, or paste the lines around the problem.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a video clip, or what you've already tried.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the [open issues](https://github.com/NebulaCoop/nebula-coop/issues) and this isn't already reported.
          required: true
        - label: This is not a security problem (those go through [SECURITY.md](https://github.com/NebulaCoop/nebula-coop/blob/main/SECURITY.md)).
          required: true
