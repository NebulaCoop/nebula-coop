# Publishes a release when a version tag is pushed (git tag -a v2.0.0 -m "Nebula 2.0.0" && git push origin v2.0.0), as
# upstream's releases are made: Nebula-Setup.exe and its release-key signature, Nebula-Setup.exe.sig, built by
# installer/build-native-setup.ps1 and checked by tools/release_check.ps1 (docs/BUILDING.md, "Releases").
# A tag with "-beta." in it (v2.0.0-beta.1) makes Nebula-Beta-Setup.exe instead, which only betas update to; any tag
# with a "-" part is published as a pre-release.
# A pull request that changes how a release is built, and Run workflow, build the same Setup without publishing it.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**
      - native/build.ps1
      - tools/enter_msvc_environment.ps1
      - tools/release_check.ps1
      - tools/release-allow.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release is never cancelled half published.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  # The LLVM the game module is built with (its row generator needs libclang 21 or later), as upstream's releases use.
  LLVM_VERSION: '22.1.6'
  # The DirectX Shader Compiler Setup ships (a mod's shaders are built with it): the release cmake/rt_shaders.cmake pins.
  DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip
  DXC_SHA256: ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      setup: ${{ steps.version.outputs.setup }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=${REF_NAME#v}
            publish=true
          else
            version=0.0.0-test.$GITHUB_RUN_NUMBER
            publish=false
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$REF_NAME is not a version tag (v1.2.3, or v1.2.3-beta.1)"
            exit 1
          fi
          # Installer/src/Common/Updater.cs: a beta's Setup has its own name (IsBetaVersion).
          case "${version,,}" in
            *-beta.*) setup=Nebula-Beta-Setup.exe ;;
            *) setup=Nebula-Setup.exe ;;
          esac
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "setup=$setup"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Nebula $version: $setup (pre-release: $prerelease, publish: $publish)"

  host:
    name: Windows programs (${{ matrix.level }})
    # Visual Studio 2022's MSVC, as the Build workflow's host job uses. Each CPU level builds the three renderers'
    # programs (Nebula, NebulaVk, NebulaD11); the AVX2 run also brings D3D12\ and glslang\.
    runs-on: windows-2022
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: avx2
            baseline: 'OFF'
          - level: x86-64-v2
            baseline: 'ON'
    steps:
      - uses: actions/Checkout@v7
      - name: Build Nebula, NebulaVk and NebulaD11
        # A release build: cross-file optimization on (NEBULA_HOST_IPO's default). There is one build kind: tests
        # attach their hooks from outside (tools/release_check.ps1 checks no source names a build kind).
        shell: pwsh
        run: |
          . .\tools\enter_msvc_environment.ps1 | Out-Null
          $build = Join-Path $env:RUNNER_TEMP 'host'
          cmake -S . -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=ON -DNEBULA_D3D11=ON `
            "-DNEBULA_HOST_BASELINE=${{ matrix.baseline }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target Nebula NebulaVk NebulaD11 nebula_glslang
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force $out, (Join-Path $out 'glslang'), (Join-Path $out 'symbols') | Out-Null
          Get-ChildItem -LiteralPath $build -Filter 'Nebula*.exe' | Copy-Item -Destination $out
          Get-ChildItem -LiteralPath $build -Filter 'Nebula*.pdb' | Copy-Item -Destination (Join-Path $out 'symbols')
          Copy-Item -Recurse -LiteralPath (Join-Path $build 'D3D12') -Destination (Join-Path $out 'D3D12')
          Copy-Item (Join-Path $build 'glslang-tool\glslang.exe'), (Join-Path $build 'glslang-tool\LICENSE.txt') (Join-Path $out 'glslang')
          Get-ChildItem -Recurse -File $out | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($out.Length + 1) }
      - uses: actions/upload-artifact@v7
        with:
          name: release-host-${{ matrix.level }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error
      # Kept for reading crash dumps of this release (docs/DIAGNOSTICS.md); not published.
      - uses: actions/upload-artifact@v7
        with:
          name: release-symbols-${{ matrix.level }}
          path: ${{ runner.temp }}/out/symbols
          retention-days: 90
          if-no-files-found: warn

  game:
    name: Game module
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/Checkout@v7
      - name: LLVM
        # The row generator needs libclang 21 or later (tools/lumacore/instrument.py), the runner's may be older.
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
          llvm/bin/clang --version
      - name: Build the game module
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'game'
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm\bin'
          # The players' build: ThinLTO with the profile in native/pgo. Both modules, the self-description and the
          # services list, for both CPU levels.
          foreach ($target in 'smg_game', 'smg_game_plain', 'luma_self_description', 'luma_services_file') {
            & .\native\build.ps1 -Petari native\petari -Build $build -Pgo -Llvm $llvm -Target $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $out = Join-Path $env:RUNNER_TEMP 'out'
          $names = Join-Path $out 'names'
          New-Item -ItemType Directory -Force (Join-Path $out 'bin\x86-64-v2'), (Join-Path $names 'luma_types') | Out-Null
          Copy-Item (Join-Path $build 'smg_game.dll'), (Join-Path $build 'smg_game_plain.dll') (Join-Path $out 'bin')
          Copy-Item (Join-Path $build 'x86-64-v2\smg_game.dll'), (Join-Path $build 'x86-64-v2\smg_game_plain.dll') (Join-Path $out 'bin\x86-64-v2')
          # The game build folder's self-description, as build-native-setup.ps1 -Names and LumaLink's --names read it.
          Copy-Item -Recurse -LiteralPath (Join-Path $build 'luma') -Destination (Join-Path $names 'luma')
          foreach ($file in 'luma_types.json', 'luma_functions.json', 'luma_numbers.json', 'luma_services.json') {
            Copy-Item (Join-Path $build "luma_types\$file") (Join-Path $names 'luma_types')
          }
          Copy-Item (Join-Path $build 'smg_game.luma-placement.json'), (Join-Path $build 'smg_game.luma-self.json') $names
          # names/ holds some 15,000 small files: as one tar, the artifact downloads as one file.
          Push-Location $out
          tar -cf names.tar names
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Remove-Item -Recurse -Force $names
      - uses: actions/upload-artifact@v7
        with:
          name: release-game
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error

  setup:
    name: Setup
    needs: [version, host, game]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SETUP: ${{ needs.version.outputs.setup }}
    steps:
      - uses: actions/Checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # Outside the tree, so that build-native-setup.ps1 records a clean commit.
      - uses: actions/download-artifact@v8
        with:
          name: release-host-avx2
          path: ${{ runner.temp }}/avx2
      - uses: actions/download-artifact@v8
        with:
          name: release-host-x86-64-v2
          path: ${{ runner.temp }}/v2
      - uses: actions/download-artifact@v8
        with:
          name: release-game
          path: ${{ runner.temp }}/game
      - name: Bin folder
        # The AVX2 programs with D3D12\ and glslang\, the x86-64-v2 programs beside them, the game modules; the
        # game's self-description as names\; LumaKit (installer/lumakit) as the mod that ships with the game.
        shell: pwsh
        run: |
          $temp = $env:RUNNER_TEMP
          Push-Location (Join-Path $temp 'game')
          tar -xf names.tar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $bin = Join-Path $temp 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item -Recurse -Path (Join-Path $temp 'avx2\*') -Destination $bin -Exclude 'symbols'
          Copy-Item (Join-Path $temp 'v2\*-x86-64-v2.exe') $bin
          Copy-Item -Recurse -Path (Join-Path $temp 'game\bin\*') -Destination $bin -Force
          $shipped = New-Item -ItemType Directory -Force (Join-Path $temp 'shipped')
          Copy-Item installer\lumakit\lumakit.luma $shipped
          Get-ChildItem -Recurse -File $bin | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($bin.Length + 1) }
      - name: DirectX Shader Compiler
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          Invoke-WebRequest -Uri $env:DXC_URL -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:DXC_SHA256) { throw "dxc.zip is $hash, not the pinned $env:DXC_SHA256" }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'dxc')
      - name: Private terms
        # release_check.ps1 expects .nebula-release-key\private-terms.txt (one term per line).
        # An empty file means no personal terms to check — the file just needs to exist.
        run: |
          $folder = New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.nebula-release-key')
          [IO.File]::WriteAllText((Join-Path $folder 'private-terms.txt'), '')
      - name: Release key
        # The private half of installer/release-public-key.xml, where build-native-setup.ps1 and release_check.ps1
        # look for it. Without it Setup is published unsigned, and the launcher's update check skips the release.
        if: needs.version.outputs.publish == 'true'
        env:
          NEBULA_RELEASE_KEY: ${{ secrets.NEBULA_RELEASE_KEY }}
        run: |
          if (-not $env:NEBULA_RELEASE_KEY) {
              Write-Output "::warning::No NEBULA_RELEASE_KEY secret: $env:SETUP is published unsigned, so installed copies won't update to it."
              exit 0
          }
          $folder = New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.nebula-release-key')
          [IO.File]::WriteAllText((Join-Path $folder 'nebula-release-private.xml'), $env:NEBULA_RELEASE_KEY)
      - name: Setup
        run: >-
          .\installer\build-native-setup.ps1 -Version $env:VERSION -Bin (Join-Path $env:RUNNER_TEMP 'bin')
          -Names (Join-Path $env:RUNNER_TEMP 'game\names') -ShippedMods (Join-Path $env:RUNNER_TEMP 'shipped') -Dxc (Join-Path $env:RUNNER_TEMP 'dxc')
          -OutputDirectory (Join-Path $env:RUNNER_TEMP 'dist')
          -SetupName $env:SETUP -Repository $env:GITHUB_REPOSITORY
      - name: Release check
        # Defender isn't run here: the runner's definitions say nothing about players' PCs.
        # Windows PowerShell, as the script is run by hand: its scanner is compiled against .NET Framework, which
        # PowerShell 7 (pwsh) is not, and there it misses System.Text.RegularExpressions.
        # -Allow whitelists known-good strings from third-party binaries (false-positive emails, etc.).
        shell: powershell
        run: >-
          .\tools\release_check.ps1 -Path (Join-Path $env:RUNNER_TEMP 'bin')
          -Installer (Join-Path $env:RUNNER_TEMP "dist\$env:SETUP")
          -Allow (Join-Path $env:GITHUB_WORKSPACE 'tools\release-allow.txt')
          -SkipDefender
      - name: Remove the release key
        if: always()
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:USERPROFILE '.nebula-release-key')
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-setup
          path: ${{ runner.temp }}/dist/${{ env.SETUP }}*
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, setup]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nebula-setup
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          SETUP: ${{ needs.version.outputs.setup }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -l dist
          # A release made by hand for this tag keeps its notes: only the files are added (or replaced).
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
            exit 0
          fi
          {
            echo '## Install or update'
            echo
            echo "1. Download \`$SETUP\` below and run it. It isn't code-signed, so Windows SmartScreen shows \"Unknown publisher\": choose **More info**, then **Run anyway**."
            echo '2. A new install: if you have Nebula installed, Setup offers to import its game files, saves and settings (Nebula itself is left as it is). Otherwise choose your own copy of the game (a disc image or an extracted folder), then **Install**.'
            echo '3. An update: choose **Update**. Saves and settings are kept.'
            echo
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          # GitHub's generated notes (the pull requests since the last release) follow notes.md.
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --title "Nebula $VERSION" \
            --notes-file notes.md --generate-notes "${flags[@]}"
