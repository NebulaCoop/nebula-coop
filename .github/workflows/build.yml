# Compiles every part of Nebula and runs its tests on each pull request and each push to main (docs/BUILDING.md), and
# keeps what it built as test builds for Windows, Linux, Android and macOS: downloads for 14 days (docs/TEST_BUILDS.md).
# Releases are built from a version tag by the Release workflow (release.yml, docs/BUILDING.md "Releases").
name: Build

on:
  # A push to a pull request's branch is built by the pull_request trigger: building it on push too ran every change
  # twice at once.
  push:
    branches: [main]
  # Every pull request, so that the Build result check always reports and can be required. Which jobs run is decided by
  # the Changes job below, for pushes to main and pull requests alike: a change that touches nothing they use skips
  # them, which counts as passing.
  pull_request:
  workflow_dispatch:

# No run-wide concurrency group: GitHub settles one before any job has seen what changed, so a push that built nothing
# (a submodule bump, documentation) cancelled the build still going. Each build job has its own group instead (the
# branch, or pull request, and the job), and the Changes job decides which parts a run builds: only those cancel the
# same jobs of an earlier run. The parts it leaves alone keep going, and this run takes their result (Earlier build).

permissions:
  contents: read

env:
  # Whose runs the Changes, Earlier build and Android check jobs look at: this branch's, or this pull request's.
  BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
  BUILD_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  # The SDL host's dependencies (platform/sdl/CMakeLists.txt, NEBULA_DEPS), at the versions cmake/vulkan_deps.cmake
  # pins for the Windows build.
  SDL_TAG: release-3.4.18
  VULKAN_SDK_TAG: vulkan-sdk-1.4.350.1
  VMA_TAG: v3.4.0
  GLSLANG_TAG: 16.6.0
  SPIRV_TOOLS_COMMIT: ef96ed763b43b59b33b31b362f09a02b729fa1c9
  SPIRV_HEADERS_COMMIT: 496543121ce6419f23d6fa5d7194ba66c36212d2
  # The DirectX Shader Compiler the Windows test build carries in dxc\ (a mod's shaders are built with it on the
  # player's PC; without it a start with mods turns them off): the release release.yml and Setup ship.
  DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip
  DXC_SHA256: ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1

jobs:
  # Sorts the changed files into the parts they affect:
  #   game:      the host, the game module, the disc import tool and the Windows, Linux and macOS test builds;
  #   android:   the Android test build: shared code and platform/android. A change to platform/android alone
  #              builds Android only;
  #   installer: Nebula Setup and the install root's Nebula.exe (installer/native), compiled.
  # Documentation, the other workflows, the NebulaNet and website submodules and the tools no build runs affect none. A
  # file both use (the icon the host and Setup are both built with, the store version Setup writes) and this workflow
  # itself run all.
  # Run workflow builds everything.
  #
  # A part that changed is then left to an earlier run of the branch that is still going, when nothing in it changed
  # since that run's commit: that run keeps building it, and this run takes its result (Earlier build). Only the parts
  # this run builds cancel an earlier run's jobs (the jobs' concurrency groups).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reads the Build runs of this branch, and cancels this one when a newer one is already going.
      actions: write
    outputs:
      game: ${{ steps.filter.outputs.game }}
      installer: ${{ steps.filter.outputs.installer }}
      android: ${{ steps.filter.outputs.android }}
      follow: ${{ steps.filter.outputs.follow }}
    steps:
      - uses: actions/Checkout@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          # A pull request: its merge commit and the base branch it was merged onto (the first parent).
          # A push: the pushed commit (the commit it is compared with is fetched below).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          # The commit this run builds, without the merge GitHub makes for a pull request.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Sets game, installer and android from a list of changed files, one per line.
          sort_files() {
            game=false
            installer=false
            android=false
            while IFS= read -r file; do
              case "$file" in
                "") ;;
                .github/workflows/build.yml) game=true; installer=true; android=true ;;
                # The Android port alone: nothing else is built for it.
                platform/android/*) android=true ;;
                # The lumalink submodule's commit carries the built-in mods the host embeds.
                lumalink) game=true; android=true ;;
                # The tools the builds run (the row generator, the shader compilers, the text packer and the
                # rest the CMake files and build scripts name) are the game's; the one Setup's compile runs is its.
                tools/lumacore/* | tools/dev/* | tools/ci/* | tools/package_text.py | tools/check_platform_items.py | \
                tools/compile_metallib.py | tools/programs_msl.cpp | tools/utility_msl.cpp | tools/msl_check.mm | \
                tools/narrow_float_audit.py)
                  game=true; android=true ;;
                tools/enter_msvc_environment.ps1) installer=true ;;
                # A submodule's new commit shows as its path alone: nebulanet and web are never built here.
                *.md | docs/* | LICENSE | .github/* | nebulanet | nebulanet/* | web | web/* | tools/*) ;;
                installer/assets/* | runtime/include/galaxy/store_version.inc)
                  game=true; installer=true; android=true ;;
                installer/*) installer=true ;;
                *) game=true; android=true ;;
              esac
            done <<< "$1"
          }
          # The Build runs of this branch, or of this pull request, newest first: "id number status commit". Pushes to
          # main and Run workflow on main are one branch's runs.
          branch_runs() {
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" -f branch="$BUILD_BRANCH" \
              -f per_page=30 --jq '.workflow_runs[]
                | select(if env.GITHUB_EVENT_NAME == "pull_request"
                         then .event == "pull_request" and .head_repository.full_name == env.BUILD_HEAD_REPO
                         else .event == "push" or .event == "workflow_dispatch" end)
                | "\(.id) \(.run_number) \(.status) \(.head_sha)"'
          }
          # "status conclusion" of one job of a run.
          job_state() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"$2\") | \"\(.status) \(.conclusion)\""
          }
          finish() {
            # A newer run of the branch already going decides for both (it compares with the same commits), and this
            # run's jobs, starting after its, would cancel them.
            newer=$(branch_runs | awk -v me="$GITHUB_RUN_NUMBER" '$2 > me && $3 != "completed" { print $1; exit }')
            if [ -n "$newer" ]; then
              echo "::notice::Run $newer of this branch is newer and still going: it builds this commit's changes too, compared with the same last good build. This run is cancelled."
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" --silent; then
                sleep 120
              fi
              # A pull request from a fork can't cancel: carry on.
            fi
            echo "Game: $game. Installer: $installer. Android: $android. Taken from an earlier run:${follow:- none}."
            { echo "game=$game"; echo "installer=$installer"; echo "android=$android"; echo "follow=${follow# }"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          all() {
            echo "Building everything: $1"
            game=true; installer=true; android=true
            finish
          }
          # The commit of the newest Build of main whose Build result passed. A push is compared with it, not with the
          # commit before it: an earlier run whose jobs a later push cancelled never finished them, so a game change
          # followed by another would otherwise build only the second. A failed build is not counted either, so its
          # changes are built again by the next push until one passes.
          last_good() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=completed&per_page=30" \
              --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")
                    | select(.conclusion != "skipped") | "\(.id) \(.head_sha)"' |
            while read -r id sha; do
              if [ "$(job_state "$id" "Build result")" = "completed success" ]; then
                echo "$sha"
                break
              fi
            done
          }

          follow=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # The whole pull request, so a cancelled run for an earlier push to it loses nothing.
              files=$(git diff --name-only HEAD^1 HEAD) ;;
            push)
              base=$(last_good || true)
              # None in the last 30 runs, or a commit no longer on GitHub (a force push): nothing to compare with.
              if [ -z "$base" ] || ! git fetch -q --depth=1 origin "$base"; then
                all "no passing build of main to compare with"
              fi
              echo "Compared with $base, the last commit of main that built."
              files=$(git diff --name-only "$base" HEAD) ;;
            *)
              all "$GITHUB_EVENT_NAME" ;;
          esac
          sort_files "$files"
          echo "$(printf '%s\n' "$files" | grep -c .) changed files, the first 100:"
          printf '%s\n' "$files" | head -n 100 | sed 's/^/  /'
          need_game=$game; need_installer=$installer; need_android=$android

          # The newest earlier run of the branch still going that has settled what it builds. A run never started (an
          # outage) or still in its Changes job is passed over: the second cancels itself, as this one is newer.
          earlier=""
          while read -r id number status sha; do
            if [ -n "$id" ] && [ "$number" -lt "$GITHUB_RUN_NUMBER" ] && [ "$status" != completed ] &&
               [ "$(job_state "$id" Changes)" = "completed success" ]; then
              earlier=$id
              earlier_sha=$sha
              break
            fi
          done <<< "$(branch_runs || true)"
          if [ -n "$earlier" ] && git fetch -q --depth=1 origin "$earlier_sha" "$HEAD_SHA" &&
             since=$(git diff --name-only "$earlier_sha" "$HEAD_SHA"); then
            sort_files "$since"
            echo "Run $earlier is still going, for $earlier_sha. Changed since then:"
            printf '%s\n' "$since" | head -n 100 | sed 's/^/  /'
            fresh_game=$game; fresh_installer=$installer; fresh_android=$android
            game=$need_game; installer=$need_installer; android=$need_android
            # A part this run needs, unchanged since that run: that run (or the one it took the part from) builds it.
            # Android doesn't count towards Build result, so its result isn't taken.
            if [ "$need_game" = true ] && [ "$fresh_game" = false ]; then
              game=false
              follow="$follow game"
            fi
            if [ "$need_installer" = true ] && [ "$fresh_installer" = false ]; then
              installer=false
              follow="$follow installer"
            fi
            if [ "$need_android" = true ] && [ "$fresh_android" = false ]; then android=false; fi
          fi
          finish

  # The parts the Changes job left to an earlier run of the branch: waits for the newest earlier run that built each
  # part and fails if it failed, so this commit's Build result still means its code built. A part whose jobs a newer
  # run cancelled has no result for this commit: Build result then cancels this run. If that earlier run is re-run after
  # failing, run this one again too.
  earlier:
    name: Earlier build
    needs: changes
    if: needs.changes.outputs.follow != ''
    runs-on: ubuntu-24.04
    # Longer than the game build takes, queued runners included.
    timeout-minutes: 180
    permissions:
      actions: read
    outputs:
      superseded: ${{ steps.wait.outputs.superseded }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          PARTS: ${{ needs.changes.outputs.follow }}
        run: |
          # The jobs a part's result is made of, the first being the one that shows whether a run built it.
          part_jobs() {
            case "$1" in
              game) printf '%s\n' "Game module" "Disc import tool (Rust)" "Host (Direct3D 12)" "Host (Vulkan)" \
                      "Windows test build" ;;
              installer) echo "Installer tests" ;;
            esac
          }
          branch_runs() {
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" -f branch="$BUILD_BRANCH" \
              -f per_page=30 --jq '.workflow_runs[]
                | select(if env.GITHUB_EVENT_NAME == "pull_request"
                         then .event == "pull_request" and .head_repository.full_name == env.BUILD_HEAD_REPO
                         else .event == "push" or .event == "workflow_dispatch" end)
                | "\(.id) \(.run_number) \(.status) \(.head_sha)"'
          }
          # A run's jobs, one per line: "status<TAB>conclusion<TAB>name".
          run_jobs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?per_page=100" \
              --jq '.jobs[] | "\(.status)\t\(.conclusion // "")\t\(.name)"'
          }
          job_line() { awk -F'\t' -v name="$2" '$3 == name' <<< "$1"; }
          # The newest earlier run that built the part, "wait" while one in between hasn't listed its jobs yet, or
          # nothing. The runs in between left the part alone: it didn't change.
          builder() {
            local primary id number status sha jobs line
            primary=$(part_jobs "$1" | head -n 1)
            while read -r id number status sha; do
              [ -n "$id" ] && [ "$number" -lt "$GITHUB_RUN_NUMBER" ] || continue
              jobs=$(run_jobs "$id") || { echo wait; return; }
              [ "$(job_line "$jobs" Changes | cut -f1,2)" = "$(printf 'completed\tsuccess')" ] || continue
              line=$(job_line "$jobs" "$primary")
              if [ -z "$line" ]; then
                [ "$status" = completed ] && continue
                echo wait
                return
              fi
              [ "$(cut -f2 <<< "$line")" = skipped ] && continue
              echo "$id"
              return
            done <<< "$(branch_runs)"
          }

          superseded=false
          for part in $PARTS; do
            while id=$(builder "$part") && [ "$id" = wait ]; do sleep 30; done
            if [ -z "$id" ]; then
              echo "::error::No earlier run of this branch built the $part. Run this workflow again."
              exit 1
            fi
            echo "The $part: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
            # Until each of its jobs has finished, or the run has.
            while :; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status || echo unknown)
              jobs=$(run_jobs "$id" || true)
              results=$(part_jobs "$part" | while IFS= read -r name; do
                line=$(job_line "$jobs" "$name")
                if [ -z "$line" ]; then echo missing; elif [ "$(cut -f1 <<< "$line")" != completed ]; then echo running
                else cut -f2 <<< "$line"; fi
              done)
              if ! grep -qx 'running\|missing' <<< "$results" || [ "$status" = completed ]; then break; fi
              sleep 60
            done
            echo "$results" | paste -d' ' <(part_jobs "$part") - | sed 's/^/  /'
            if grep -qx 'failure\|timed_out' <<< "$results"; then
              echo "::error::The $part failed in run $id."
              exit 1
            elif grep -qvx success <<< "$results"; then
              echo "A newer run took the $part over from run $id: there is no result for this commit's."
              superseded=true
            fi
          done
          echo "superseded=$superseded" >> "$GITHUB_OUTPUT"

  import:
    name: Disc import tool (Rust)
    needs: changes
    if: needs.changes.outputs.game == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-import
      cancel-in-progress: true
    runs-on: windows-2025
    env:
      # The C runtime linked in, as Setup ships it: it runs on PCs without the Visual C++ runtime.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/Checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start sccache
        run: sccache --start-server
      # The program (packs the disc) and the library the game loads beside it (nebula_import.dll: a start with mods
      # checks and cooks them with it, and turns every mod off when it is missing).
      - name: Build
        run: cargo build --release --locked -p nebula-import
      - name: Test
        run: cargo test --locked -p nebula-import
      - uses: actions/upload-artifact@v7
        with:
          name: windows-import
          path: |
            target/release/nebula-import.exe
            target/release/nebula_import.dll
          retention-days: 1
          if-no-files-found: error

  host:
    name: Host (${{ matrix.renderer }})
    needs: changes
    if: needs.changes.outputs.game == 'true'
    # Visual Studio 2022's MSVC: with 2026's (MSVC 19.51, windows-2025) the frame interpolation and interp GPU
    # tests fail every palette check, which no other compiler reproduces.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-host-${{ matrix.vulkan }}
      cancel-in-progress: true
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: Direct3D 12
            vulkan: OFF
          - renderer: Vulkan
            vulkan: ON
    env:
      # Compile on this machine when the sccache server can't be reached mid-build, instead of failing.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/Checkout@v7
      # The built-in mods, packed in the lumalink submodule (cmake/nebula_builtin_mods.cmake).
      - name: Built-in mods
        run: git submodule update --init --depth 1 lumalink
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # The libraries CMake builds at configure time (zlib, xz, libarchive, the FidelityFX SDK) and the downloaded
      # Vulkan sources: each is skipped when its files are already in the build tree.
      - name: Cache configure-time dependencies
        uses: actions/cache@v6
        with:
          path: |
            build/host/archive-deps
            build/host/fidelityfx.built
            build/host/_deps
          key: host-deps-${{ matrix.vulkan }}-${{ hashFiles('cmake/**', 'third_party/archive/**') }}
      # The compiled shader stages (tools/dev/compile_programs.py keeps each beside its blob, named by what decides it,
      # and drops the ones no build uses): only the stages that changed are compiled again. The runner image names the
      # Windows SDK's dxc, which compile_programs.py knows by its path only.
      - name: Runner image
        id: image
        shell: bash
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache the compiled shader stages
        uses: actions/cache@v6
        with:
          path: |
            build/host/generated/programs_dxil.bin.stages
            build/host/generated/programs_spirv.bin.stages
          key: host-programs-${{ matrix.vulkan }}-${{ steps.image.outputs.version }}-${{ hashFiles('runtime/src/render/**', 'runtime/include/**', 'tools/dev/**', 'cmake/vulkan_deps.cmake') }}
          restore-keys: host-programs-${{ matrix.vulkan }}-${{ steps.image.outputs.version }}-
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start sccache
        run: sccache --start-server
      - name: Configure
        # Without cross-file optimization: the link of every test against the renderer library otherwise takes
        # minutes. Release builds keep it (NEBULA_HOST_IPO defaults to ON).
        run: >-
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=${{ matrix.vulkan }}
          -DNEBULA_HOST_IPO=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
      # The Vulkan build makes both programs: the test build's.
      - if: matrix.vulkan == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: windows-hosts
          path: |
            build/host/Nebula.exe
            build/host/NebulaVk.exe
          retention-days: 1
          if-no-files-found: error
      # The shader tools the Android build runs on this machine (platform/sdl's NEBULA_HOST_TOOLS).
      - if: matrix.vulkan == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: spirv-tools
          path: |
            build/host/galaxy_native_spirv.exe
            build/host/galaxy_utility_spirv.exe
          retention-days: 1
          if-no-files-found: error

  game:
    name: Game module
    needs: changes
    if: needs.changes.outputs.game == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-game
      cancel-in-progress: true
    runs-on: windows-2025
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_GHA_ENABLED: "true"
      LLVM_VERSION: '22.1.6'
    steps:
      - uses: actions/Checkout@v7
      # The built-in mods, packed in the lumalink submodule (cmake/nebula_builtin_mods.cmake).
      - name: Built-in mods
        run: git submodule update --init --depth 1 lumalink
      - name: LLVM
        # The row generator needs libclang 21 or later (tools/lumacore/instrument.py); the runner's is older. The
        # release's LLVM, as release.yml's game job takes it.
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
          llvm/bin/clang --version
      # Archive deps (zlib, xz, libarchive) built at configure time: skip when already built.
      - name: Cache configure-time dependencies
        uses: actions/cache@v6
        with:
          path: |
            build/game/archive-deps
          key: game-archive-deps-${{ hashFiles('cmake/**', 'third_party/archive/**') }}
      # The row generator's outputs (tools/lumacore/instrument.py, NEBULA_LUMA_CACHE): a unit none of whose files
      # changed is taken from here instead of parsed again. Entries no build used are dropped before saving.
      - name: Cache the row generator's outputs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/luma-cache
          key: game-luma-${{ hashFiles('tools/lumacore/*.py') }}-${{ github.sha }}
          restore-keys: game-luma-${{ hashFiles('tools/lumacore/*.py') }}-
      - name: Note the time
        id: started
        shell: bash
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start sccache
        run: sccache --start-server
      - name: Build
        env:
          NEBULA_LUMA_CACHE: ${{ runner.temp }}/luma-cache
        # The x86-64-v3 module only (-NoBaseline): the test build carries no other, and the x86-64-v2 one is the same
        # source compiled again (row generator included), which doubled this job. The release builds both. Compiles go
        # through sccache, as the host jobs' do, and the row generator takes each unchanged unit from its cache.
        run: >-
          .\native\build.ps1 -Petari native\petari -Build build\game -Llvm (Join-Path $env:RUNNER_TEMP 'llvm\bin')
          -NoBaseline -UseSccache
      - name: Drop unused row generator outputs
        shell: bash
        env:
          CACHE: ${{ runner.temp }}/luma-cache
          STARTED: ${{ steps.started.outputs.at }}
        run: tools/ci/prune_luma_cache.sh "$CACHE" "$STARTED"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-game-module
          path: build/game/smg_game.dll
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Windows test build
    # What the jobs above built and tested, put together: nothing is compiled again.
    needs: [import, host, game]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-windows
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/Checkout@v7
        with:
          sparse-checkout: |
            LICENSE
            THIRD-PARTY-NOTICES.md
            docs/TEST_BUILDS.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - name: Stage
        run: cp LICENSE THIRD-PARTY-NOTICES.md docs/TEST_BUILDS.md dist/
      # dxc\ beside the game, as Setup installs it (installer/build-native-setup.ps1): the Direct3D 12 program's start
      # check wants dxc.exe, dxcompiler.dll and dxil.dll there whenever a mod is on.
      - name: DirectX Shader Compiler
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dxc.zip" "$DXC_URL"
          echo "$DXC_SHA256  $RUNNER_TEMP/dxc.zip" | sha256sum -c -
          # The zip names its folders with backslashes: unzip turns them into folders and says so with status 1.
          unzip -q "$RUNNER_TEMP/dxc.zip" -d "$RUNNER_TEMP/dxc" || test $? -eq 1
          mkdir -p dist/dxc
          for name in bin/x64/dxc.exe bin/x64/dxcompiler.dll bin/x64/dxil.dll LICENSE-MS.txt LICENCE-MIT.txt LICENSE-LLVM.txt; do
            cp "$RUNNER_TEMP/dxc/$name" dist/dxc/
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-windows-x64
          path: dist
          retention-days: 14
          if-no-files-found: error

  linux:
    name: Linux
    # Needs the game module job: if the game module doesn't build, the Linux binary is useless.
    needs: [changes, game]
    if: needs.changes.outputs.game == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/Checkout@v7
      # The built-in mods, packed in the lumalink submodule (cmake/nebula_builtin_mods.cmake).
      - name: Built-in mods
        run: git submodule update --init --depth 1 lumalink
      - name: System packages
        # SDL3's video, audio and input back ends (X11, Wayland, ALSA, PulseAudio, PipeWire, udev), and the game
        # module's row generator's libclang 22 (tools/lumacore/gen_types.py reads some member types differently with
        # 21; Ubuntu 24.04 has 18), as the release's game build uses. One package list update for both. The manual
        # page index is not rebuilt after each package (man-db's trigger): minutes on a runner, for pages nobody reads.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libegl-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev \
            clang-22 libclang1-22 libclang-common-22-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          mkdir -p deps && cd deps
          clone() { git -c advice.detachedHead=false clone -q --depth 1 --branch "$2" "https://github.com/$1" "$3"; }
          pin() { mkdir -p "$3" && git -C "$3" init -q && git -C "$3" fetch -q --depth 1 "https://github.com/$1" "$2" &&
                  git -C "$3" -c advice.detachedHead=false checkout -q FETCH_HEAD; }
          clone libsdl-org/SDL "$SDL_TAG" SDL3-3.4.18
          clone KhronosGroup/Vulkan-Headers "$VULKAN_SDK_TAG" Vulkan-Headers-vulkan-sdk-1.4.350.1
          clone zeux/volk "$VULKAN_SDK_TAG" volk-vulkan-sdk-1.4.350.1
          clone GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$VMA_TAG" VulkanMemoryAllocator-v3.4.0
          clone KhronosGroup/glslang "$GLSLANG_TAG" glslang-src
          pin KhronosGroup/SPIRV-Tools "$SPIRV_TOOLS_COMMIT" glslang-src/External/spirv-tools
          pin KhronosGroup/SPIRV-Headers "$SPIRV_HEADERS_COMMIT" glslang-src/External/spirv-tools/external/spirv-headers
      # As the Windows jobs: compiles through sccache, the compiled shader stages and the row generator's outputs kept
      # between runs (see the Host and Game module jobs).
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start sccache
        run: sccache --start-server
      - name: Cache the compiled shader stages
        uses: actions/cache@v6
        with:
          path: build/host/generated/programs_spirv.bin.stages
          key: linux-programs-${{ hashFiles('runtime/src/render/**', 'runtime/include/**', 'tools/dev/**', 'cmake/vulkan_deps.cmake') }}
          restore-keys: linux-programs-
      - name: Cache the row generator's outputs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/luma-cache
          key: linux-luma-${{ hashFiles('tools/lumacore/*.py') }}-${{ github.sha }}
          restore-keys: linux-luma-${{ hashFiles('tools/lumacore/*.py') }}-
      - name: Note the time
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Host
        env:
          CC: clang
          CXX: clang++
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          cmake -S platform/sdl -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release "-DNEBULA_DEPS=$PWD/deps"
          cmake --build build/host --target main
      - name: Game module
        env:
          CC: clang-22
          CXX: clang++-22
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          NEBULA_LUMA_CACHE: ${{ runner.temp }}/luma-cache
        run: |
          # apt.llvm.org names its libclang libclang-22.so.1, which the row generator does not find beside the compiler.
          cmake -S native -B build/game -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_LIBCLANG=/usr/lib/llvm-22/lib/libclang-22.so.1
          cmake --build build/game --target smg_game
      - name: Drop unused row generator outputs
        run: tools/ci/prune_luma_cache.sh "$RUNNER_TEMP/luma-cache" "${{ steps.started.outputs.at }}"
      # The program and the library the game loads with mods on (libnebula_import.so; without it every mod is off).
      - name: Disc import tool
        run: cargo build --release --locked -p nebula-import
      - name: Stage
        # The program finds libSDL3, the game module and the importer's library beside it.
        run: |
          mkdir -p dist
          cp build/host/nebula dist/Nebula
          cp -L build/host/libSDL3.so.0 build/game/libsmg_game.so target/release/nebula-import target/release/libnebula_import.so dist/
          patchelf --set-rpath '$ORIGIN' dist/Nebula
          cp LICENSE THIRD-PARTY-NOTICES.md docs/TEST_BUILDS.md dist/
          # Artifacts drop file modes: a tar keeps the programs executable.
          tar -C dist -czf nebula-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-linux-x64
          path: nebula-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error

  # Whether a newer run of the branch is already building Android: this run's Android build starts only once the game
  # module has built, so it could otherwise start after the newer one's and cancel it (their concurrency group).
  android-check:
    name: Android check
    needs: [changes, host, game]
    if: ${{ !cancelled() && needs.changes.outputs.android == 'true' && needs.game.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      newer: ${{ steps.check.outputs.newer }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" -f branch="$BUILD_BRANCH" \
            -f per_page=30 --jq '.workflow_runs[]
              | select(if env.GITHUB_EVENT_NAME == "pull_request"
                       then .event == "pull_request" and .head_repository.full_name == env.BUILD_HEAD_REPO
                       else .event == "push" or .event == "workflow_dispatch" end)
              | select(.run_number > (env.GITHUB_RUN_NUMBER | tonumber)) | .id' || true)
          for id in $runs; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Android") | "\(.status) \(.conclusion)"' || true)
            case "$state" in
              "" | "completed skipped" | "completed cancelled") ;;
              *)
                echo "Run $id is newer and builds Android ($state): this run's Android build is skipped."
                echo "newer=true" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
          done
          echo "No newer run builds Android."

  android:
    name: Android
    # The Vulkan host build's shader tools compile the SPIR-V the APK carries; on a change to platform/android alone
    # the host isn't built, so this job builds the two tools itself. A failed host or game module stops it, and so
    # does a newer run already building Android (Android check).
    needs: [changes, host, game, android-check]
    if: >-
      !cancelled() && needs.changes.outputs.android == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      needs.android-check.outputs.newer != 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-android
      cancel-in-progress: true
    runs-on: windows-2025
    env:
      LLVM_VERSION: '22.1.6'
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/Checkout@v7
      # The built-in mods, packed in the lumalink submodule (cmake/nebula_builtin_mods.cmake).
      - name: Built-in mods
        run: git submodule update --init --depth 1 lumalink
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # The importer's crates, built where build_apk.ps1 puts them (CARGO_TARGET_DIR).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/android/cargo"
      - name: LLVM
        # The game module's row generator runs on this machine and needs libclang 21 or later
        # (tools/lumacore/instrument.py); the NDK has none and the runner's is 20. The Game module job's LLVM: the APK
        # step names it in LLVM_ROOT, which native/CMakeLists.txt looks in first.
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
          llvm/bin/clang --version
      - name: Android SDK
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          # Every licence question answered yes.
          1..20 | ForEach-Object { 'y' } | & $sdkmanager --install 'ndk;28.2.13676358' 'platforms;android-36' |
              Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed ($LASTEXITCODE)" }
      - name: Dependencies
        shell: bash
        run: |
          mkdir -p deps && cd deps
          clone() { git -c advice.detachedHead=false clone -q --depth 1 --branch "$2" "https://github.com/$1" "$3"; }
          pin() { mkdir -p "$3" && git -C "$3" init -q && git -C "$3" fetch -q --depth 1 "https://github.com/$1" "$2" &&
                  git -C "$3" -c advice.detachedHead=false checkout -q FETCH_HEAD; }
          clone libsdl-org/SDL "$SDL_TAG" SDL3-3.4.18
          clone KhronosGroup/Vulkan-Headers "$VULKAN_SDK_TAG" Vulkan-Headers-vulkan-sdk-1.4.350.1
          clone zeux/volk "$VULKAN_SDK_TAG" volk-vulkan-sdk-1.4.350.1
          clone GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$VMA_TAG" VulkanMemoryAllocator-v3.4.0
          clone KhronosGroup/glslang "$GLSLANG_TAG" glslang-src
          pin KhronosGroup/SPIRV-Tools "$SPIRV_TOOLS_COMMIT" glslang-src/External/spirv-tools
          pin KhronosGroup/SPIRV-Headers "$SPIRV_HEADERS_COMMIT" glslang-src/External/spirv-tools/external/spirv-headers
          # arm64's driver loader (platform/sdl/CMakeLists.txt NEBULA_ADRENOTOOLS_DIR), at tools/fetch_build_deps.sh's
          # revisions: libadrenotools with liblinkernsbypass in its lib/linkernsbypass.
          pin bylaws/libadrenotools 8fae8ce254dfc1344527e05301e43f37dea2df80 libadrenotools-8fae8ce
          pin bylaws/liblinkernsbypass aa3975893d83ef1bc84c321ec60c65fbf1287887 libadrenotools-8fae8ce/lib/linkernsbypass
      - if: needs.host.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: spirv-tools
          path: build/spirv-tools
      - if: needs.host.result != 'success'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - if: needs.host.result != 'success'
        name: Cache configure-time dependencies
        uses: actions/cache@v6
        with:
          path: |
            build/host/archive-deps
            build/host/fidelityfx.built
            build/host/_deps
          key: host-deps-ON-${{ hashFiles('cmake/**', 'third_party/archive/**') }}
      - if: needs.host.result != 'success'
        name: Shader tools
        run: |
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=ON -DNEBULA_HOST_IPO=OFF
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build/host --target galaxy_native_spirv galaxy_utility_spirv
          if ($LASTEXITCODE -ne 0) { throw "the shader tools did not build" }
          New-Item -ItemType Directory -Force build/spirv-tools | Out-Null
          Copy-Item build/host/galaxy_native_spirv.exe, build/host/galaxy_utility_spirv.exe build/spirv-tools
      # As the Windows jobs: compiles through sccache, and the row generator's outputs kept between runs.
      - name: Cache the row generator's outputs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/luma-cache
          key: android-luma-${{ hashFiles('tools/lumacore/*.py') }}-${{ github.sha }}
          restore-keys: android-luma-${{ hashFiles('tools/lumacore/*.py') }}-
      - name: Note the time
        id: started
        shell: bash
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start sccache
        run: sccache --start-server
      - name: APK
        # Debug-signed: no -Signing. A test build, as the Windows one: arm64 only (the phones it is for; x86_64 is for
        # emulators) and without ThinLTO (-Plain), which the release's APK keeps.
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          NEBULA_LUMA_CACHE: ${{ runner.temp }}/luma-cache
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:LLVM_ROOT = Join-Path $env:RUNNER_TEMP 'llvm'
          .\platform\android\build_apk.ps1 -Deps "$PWD\deps" -Work "$PWD\build\android" -HostTools "$PWD\build\spirv-tools" `
              -Abis arm64-v8a -Plain
      - name: Drop unused row generator outputs
        shell: bash
        env:
          CACHE: ${{ runner.temp }}/luma-cache
          STARTED: ${{ steps.started.outputs.at }}
        run: tools/ci/prune_luma_cache.sh "$CACHE" "$STARTED"
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-logs
          path: build/android/*.log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-android
          path: |
            build/android/Nebula.apk
            docs/TEST_BUILDS.md
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS
    # Apple silicon only (the runner's own processor), as platform/apple/build_macos.sh builds it:
    # the Metal renderer, Apple's host and the game module, packed as Nebula.app. Not in Build result's needs: the
    # Mac port isn't finished, so it doesn't block a merge.
    # Also needs the game module job: if it doesn't build, the app is useless.
    needs: [changes, game]
    if: needs.changes.outputs.game == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-macos
      cancel-in-progress: true
    runs-on: macos-15
    env:
      # LLVM 19 (LLVM's own macOS package), and libc++ built from the same release.
      LLVM_VERSION: 19.1.7
      # The game module's row generator parses with libclang on this machine and needs LLVM 21 or later
      # (tools/lumacore/instrument.py): the release's LLVM, as the Windows and Android jobs take it.
      LIBCLANG_LLVM_VERSION: '22.1.6'
      MOLTENVK_TAG: v1.4.2
    steps:
      - uses: actions/Checkout@v7
      # The built-in mods, packed in the lumalink submodule (cmake/nebula_builtin_mods.cmake).
      - name: Built-in mods
        run: git submodule update --init --depth 1 lumalink
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ninja
        run: brew install ninja
      # LLVM and the libc++ build_libcxx.sh makes from its sources: the slow part, kept until either changes.
      - name: Cache the toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apple/toolchain
          key: macos-toolchain-arm64-${{ env.LLVM_VERSION }}-${{ hashFiles('platform/apple/build_libcxx.sh') }}
      - name: Toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          tools="$RUNNER_TEMP/apple"
          release="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION"
          mkdir -p "$tools/toolchain/llvm" "$RUNNER_TEMP/llvm-src"
          curl -fsSL "$release/LLVM-$LLVM_VERSION-macOS-ARM64.tar.xz" | tar -xJ --strip-components=1 -C "$tools/toolchain/llvm"
          curl -fsSL "$release/llvm-project-$LLVM_VERSION.src.tar.xz" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/llvm-src"
          "$tools/toolchain/llvm/bin/clang" --version
          platform/apple/build_libcxx.sh "$RUNNER_TEMP/llvm-src" "$tools/toolchain/llvm" "$tools/toolchain/libcxx" macos arm64
          rm -rf "$tools/toolchain/libcxx/build-macos-arm64"
      # The row generator's libclang: only libclang.dylib (it links nothing else of the package) and its built-in headers
      # (lib/clang/<version>/include) are kept from LLVM's package. The toolchain's own LLVM 19 is too old for it.
      - name: Cache the row generator's libclang
        id: libclang
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/libclang
          key: macos-libclang-arm64-${{ env.LIBCLANG_LLVM_VERSION }}
      - name: Row generator's libclang
        if: steps.libclang.outputs.cache-hit != 'true'
        run: |
          package="LLVM-$LIBCLANG_LLVM_VERSION-macOS-ARM64"
          mkdir -p "$RUNNER_TEMP/libclang"
          curl -fsSL --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LIBCLANG_LLVM_VERSION/$package.tar.xz" |
            tar -xJ --strip-components=1 -C "$RUNNER_TEMP/libclang" "$package/lib/libclang.dylib" "$package/lib/clang"
          test -f "$RUNNER_TEMP/libclang/lib/libclang.dylib"
          ls "$RUNNER_TEMP"/libclang/lib/clang/*/include/stdarg.h
      - name: Dependencies
        # What the Linux job checks out, and MoltenVK and SPIRV-Cross (platform/apple/CMakeLists.txt).
        run: |
          mkdir -p "$RUNNER_TEMP/apple/deps" && cd "$RUNNER_TEMP/apple/deps"
          clone() { git -c advice.detachedHead=false clone -q --depth 1 --branch "$2" "https://github.com/$1" "$3"; }
          pin() { mkdir -p "$3" && git -C "$3" init -q && git -C "$3" fetch -q --depth 1 "https://github.com/$1" "$2" &&
                  git -C "$3" -c advice.detachedHead=false checkout -q FETCH_HEAD; }
          clone libsdl-org/SDL "$SDL_TAG" SDL3-3.4.18
          clone KhronosGroup/Vulkan-Headers "$VULKAN_SDK_TAG" Vulkan-Headers-vulkan-sdk-1.4.350.1
          clone zeux/volk "$VULKAN_SDK_TAG" volk-vulkan-sdk-1.4.350.1
          clone GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$VMA_TAG" VulkanMemoryAllocator-v3.4.0
          clone KhronosGroup/glslang "$GLSLANG_TAG" glslang-src
          pin KhronosGroup/SPIRV-Tools "$SPIRV_TOOLS_COMMIT" glslang-src/External/spirv-tools
          pin KhronosGroup/SPIRV-Headers "$SPIRV_HEADERS_COMMIT" glslang-src/External/spirv-tools/external/spirv-headers
          clone KhronosGroup/SPIRV-Cross "$VULKAN_SDK_TAG" SPIRV-Cross-vulkan-sdk-1.4.350.1
          mkdir -p MoltenVK
          curl -fsSL "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_TAG/MoltenVK-all.tar" | tar -x -C MoltenVK
          if [ ! -f MoltenVK/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib ]; then
            echo "::error::libMoltenVK.dylib is not where platform/apple/CMakeLists.txt looks for it:"
            find MoltenVK -name libMoltenVK.dylib
            exit 1
          fi
      - name: Build
        # The game module's configure takes the row generator's libclang from LLVM_ROOT (native/CMakeLists.txt): the Apple
        # toolchain file makes it a cross build, so it doesn't look beside the compiler.
        env:
          LLVM_ROOT: ${{ runner.temp }}/libclang
        run: platform/apple/build_macos.sh -t "$RUNNER_TEMP/apple" -w "$RUNNER_TEMP/apple-build" -a arm64
      - name: Stage
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/apple-build/Nebula-macOS.zip" docs/TEST_BUILDS.md dist/
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-macos-arm64
          path: dist
          retention-days: 14
          if-no-files-found: error

  installer:
    name: Installer tests
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-installer
      cancel-in-progress: true
    runs-on: windows-2025
    steps:
      - uses: actions/Checkout@v7
      # Setup and the install root's Nebula.exe (installer/native) compiled as build-native-setup.ps1 compiles them, with
      # warnings as errors, against a stand-in build_info.h: the release build needs a whole game to pack, this does not.
      - name: Native Setup compiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tools\enter_msvc_environment.ps1
          $gen = Join-Path $env:RUNNER_TEMP 'setup-gen'
          $obj = Join-Path $env:RUNNER_TEMP 'setup-obj'
          New-Item -ItemType Directory -Force $gen, $obj | Out-Null
          $key = (Get-Content -Raw installer\release-public-key.xml).Trim().Replace('\', '\\').Replace('"', '\"')
          $store = (Get-Content -Raw runtime\include\galaxy\store_version.inc).Trim()
          Set-Content -Encoding utf8 (Join-Path $gen 'build_info.h') @"
          #pragma once
          namespace nebula::build {
          inline constexpr const wchar_t kVersion[] = L"0.0.0-ci";
          inline constexpr const wchar_t kFileVersion[] = L"0.0.0.0";
          inline constexpr const wchar_t kCommit[] = L"$env:GITHUB_SHA";
          inline constexpr const wchar_t kRepository[] = L"$env:GITHUB_REPOSITORY";
          inline constexpr const wchar_t kReleasePublicKeyXml[] = L"$key";
          inline constexpr unsigned kStoreVersion = $store;
          }
          "@
          $cxx = @('/nologo', '/c', '/std:c++20', '/O2', '/MT', '/DNDEBUG', '/EHsc', '/W4', '/WX', '/permissive-', '/utf-8', '/Zc:__cplusplus',
              '/GS', '/guard:cf', '/DUNICODE', '/D_UNICODE', '/D_WIN32_WINNT=0x0A00', '/DWINVER=0x0A00', "/I$gen", '/Iinstaller\native',
              '/Ithird_party\miniz')
          foreach ($name in 'common', 'archive', 'ui', 'text', 'setup', 'setup_engine', 'start') {
              & cl.exe @cxx "/Fo$(Join-Path $obj "$name.obj")" "installer\native\$name.cpp"
              if ($LASTEXITCODE -ne 0) { throw "$name.cpp did not compile" }
          }

  # The one check to require before merging: it fails when the Windows build (host, game module, disc import tool and
  # the test build put together from them) or the installer tests failed, here or in the earlier run this one took them
  # from (Earlier build), and passes when they passed or were skipped. When a newer run of the branch cancelled some of
  # them, the run is cancelled instead. Linux, Android and macOS are still built and show their own checks, but don't
  # block a merge: those ports aren't finished.
  result:
    name: Build result
    # Not always(): a run that was cancelled (by hand, or by its own Changes job for a newer run) ends at once, instead
    # of waiting for a runner and then for its cancelled jobs. A run that is going reports here, skipped jobs included.
    if: ${{ !cancelled() }}
    needs: [changes, earlier, import, host, game, windows, installer]
    runs-on: ubuntu-24.04
    permissions:
      # Cancels this run when a newer one took part of it over.
      actions: write
    steps:
      - name: Check
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          needs.earlier.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: |
          [ "$FAILED" = false ] || exit 1
          # Not failed: cancelled, as the whole run was before a newer run cancelled only some of its jobs. Once its
          # other jobs have finished, which the newer run may have left to it (an Android build).
          echo "A newer run of this branch took part of this one over: it is cancelled once its other jobs finish."
          while n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
                      --jq '[.jobs[] | select(.name != "Build result" and .status != "completed")] | length') &&
                [ "$n" != 0 ]; do
            sleep 60
          done
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" --silent && sleep 300
          exit 1
